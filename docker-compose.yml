services:
  # ==========================================
  # 1. PostgreSQL 16 Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: mdalats-villa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mdalats_villa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mdalats_villa"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mdalats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 2. Redis 7 In-Memory Cache & Key-Value
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: mdalats-villa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mdalats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 3. Silo (Pigsty S3 Object Storage for Images & Videos)
  # Community-maintained, open-source MinIO distribution
  # ==========================================
  minio:
    image: pgsty/silo:latest
    container_name: mdalats-villa-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # Silo Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword123
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_SERVER_URL: http://localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - mdalats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 4. Silo Bucket & Media Policy Initializer (pgsty/mc)
  # Automatically creates bucket & configures public streaming
  # ==========================================
  minio-init:
    image: pgsty/mc:latest
    container_name: mdalats-villa-minio-init
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin miniopassword123); do
        echo 'Waiting for Silo server to be ready...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/mdalats-media;
      /usr/bin/mc anonymous set download local/mdalats-media;
      echo '==================================================';
      echo 'Silo bucket [mdalats-media] is ready for Images & Videos!';
      echo 'Public access URL: http://localhost:9000/mdalats-media/...';
      echo '==================================================';
      exit 0;
      "
    networks:
      - mdalats-network

  # ==========================================
  # 5. M_Dalats Boutique Villa - Next.js Web App
  # Service name 'app' supports standard `docker compose pull app`
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tuananhcoder1/dalats:latest
    container_name: mdalats-villa-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/mdalats_villa
      - REDIS_URL=redis://:redispassword@redis:6379
      - BETTER_AUTH_SECRET=K2WBz3+c7ZM2B4sSxvu5EPXAH9tx60Y25QEAAoFGBv4=
      - BETTER_AUTH_URL=https://dalatsvilla.duckdns.org
      - BETTER_AUTH_TRUSTED_ORIGINS=https://dalatsvilla.duckdns.org,http://localhost:3000,http://localhost
      - BETTER_AUTH_GITHUB_CLIENT_ID=
      - BETTER_AUTH_GITHUB_CLIENT_SECRET=
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=miniopassword123
      - S3_BUCKET=mdalats-media
      - S3_PUBLIC_URL=https://dalatsvilla.duckdns.org/media
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - app_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      mdalats-network:
        aliases:
          - mdalats-villa
          - app
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 6. Nginx Unified Gateway & Media Reverse Proxy
  # Routes port 80 to Web + high-performance MinIO video streaming
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: mdalats-villa-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - minio
    networks:
      - mdalats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mdalats-network:
    name: mdalats-network
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  app_uploads:
