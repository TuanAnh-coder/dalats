services:
  # ==========================================
  # 1. PostgreSQL 16 Database (Chuyên biệt cho M_Dalats Villa)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: mdalats-villa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mdalats_villa
    ports:
      - "5433:5432"   # Map port 5433 trên host để tránh trùng port 5432 với service khác
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mdalats_villa"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mdalats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 2. Redis 7 In-Memory Cache (Chuyên biệt cho M_Dalats Villa)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: mdalats-villa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redispassword
    ports:
      - "6380:6379"   # Map port 6380 trên host để tránh trùng port 6379 với service khác
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mdalats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 3. Silo / MinIO Bucket Initializer
  # Kết nối tới MinIO dùng chung trên port 9000 để tạo bucket 'mdalats-media'
  # và phân quyền public download cho ảnh/video
  # ==========================================
  minio-init:
    image: pgsty/mc:latest
    container_name: mdalats-villa-minio-init
    restart: "no"
    extra_hosts:
      - "minio:host-gateway"
      - "host.docker.internal:host-gateway"
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set shared http://minio:9000 minioadmin minioadmin || /usr/bin/mc alias set shared http://minio:9000 minioadmin miniopassword123); do
        echo 'Dang cho MinIO dung chung tren port 9000 san sang...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing shared/mdalats-media;
      /usr/bin/mc anonymous set download shared/mdalats-media;
      echo '==================================================';
      echo 'Bucket [mdalats-media] tren MinIO dung chung da san sang!';
      echo '==================================================';
      exit 0;
      "
    networks:
      - mdalats-network

  # ==========================================
  # 4. M_Dalats Boutique Villa - Next.js Web App
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tuananhcoder1/dalats:latest
    container_name: mdalats-villa-app
    restart: unless-stopped
    ports:
      - "3001:3000"   # Map port 3001 trên host để tránh trùng port 3000 với service khác
    extra_hosts:
      - "minio:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/mdalats_villa
      - REDIS_URL=redis://:redispassword@redis:6379
      - BETTER_AUTH_SECRET=K2WBz3+c7ZM2B4sSxvu5EPXAH9tx60Y25QEAAoFGBv4=
      - BETTER_AUTH_URL=https://dalatsvilla.duckdns.org
      - BETTER_AUTH_TRUSTED_ORIGINS=https://dalatsvilla.duckdns.org,http://localhost:3000,http://localhost:3001,http://localhost
      - BETTER_AUTH_GITHUB_CLIENT_ID=
      - BETTER_AUTH_GITHUB_CLIENT_SECRET=
      # MinIO S3 dùng chung (kết nối qua host-gateway port 9000)
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=mdalats-media
      - S3_PUBLIC_URL=https://dalatsvilla.duckdns.org/media
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - app_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      mdalats-network:
        aliases:
          - mdalats-villa
          - app
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 5. Nginx Unified Gateway & Media Reverse Proxy
  # Routes port 80 to Web + video streaming từ MinIO dùng chung
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: mdalats-villa-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "minio:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - mdalats-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mdalats-network:
    name: mdalats-network
    driver: bridge

volumes:
  pgdata:
  redisdata:
  app_uploads:
