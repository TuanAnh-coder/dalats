events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 300M;

    upstream web_app {
        server mdalats-villa:3000;
    }

    upstream minio_api {
        server minio:9000;
    }

    upstream minio_console {
        server minio:9001;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------
        # 1. Main Next.js Web Application
        # ----------------------------------------------------
        location / {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 2. Public Media Stream (Images & Videos from MinIO)
        # Enables HTTP 206 Partial Content for video scrub/seek
        # ----------------------------------------------------
        location /media/ {
            rewrite ^/media/(.*) /mdalats-media/$1 break;
            proxy_pass http://minio_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High-performance video streaming & zero buffer delay
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;

            # Universal CORS for video & image embedding
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, Content-Range, Content-Type, Authorization' always;
            add_header Cache-Control 'public, max-age=604800, immutable' always;
        }

        # ----------------------------------------------------
        # 3. MinIO S3 API Endpoint (Direct uploads & client sdk)
        # ----------------------------------------------------
        location /s3/ {
            rewrite ^/s3/(.*) /$1 break;
            proxy_pass http://minio_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 300M;
        }

        # ----------------------------------------------------
        # 4. MinIO Web Console UI Dashboard
        # ----------------------------------------------------
        location /minio/ {
            proxy_pass http://minio_console/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
